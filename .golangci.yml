version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.Setenv
        - (io.Closer).Close
        - (*os.File).Close
        - (*bufio.Writer).Flush
    staticcheck:
      checks:
        - all
        - -QF1008
        - -ST1000
        - -ST1021
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - \.tmp-gocache
      - \.gocache
