name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: gofmt 检查
        run: test -z "$(gofmt -l main.go main_test.go cmd internal)"
      - name: go vet
        run: go vet ./...
      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: 覆盖率摘要
        if: always()
        run: |
          {
            echo "## 测试覆盖率"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo ""
            echo "覆盖率最低的函数 (定位盲区):"
            go tool cover -func=coverage.out | grep -v '^total' | awk '{print $3, $1}' | sort -rn | tail -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  lint:
    name: 静态检查 (golangci-lint + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Actions 必须按 SHA 固定
        run: bash scripts/check-actions-pinned.sh

  cross-build:
    name: 交叉编译冒烟 (build.sh all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: 全平台编译
        run: bash build.sh all
      - name: 产物完整性
        run: |
          ls -l bin/
          test -x bin/s3cli-linux-amd64
          test -x bin/s3cli-linux-arm64
          test -x bin/s3cli-darwin-amd64
          test -x bin/s3cli-darwin-arm64
          test -f bin/s3cli-windows-amd64.exe

  e2e:
    name: 真实 S3 端到端 (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      localstack:
        image: localstack/localstack:3.8@sha256:fc9a03f14f4668f5d874eadb77e5da5461ce735e2ce86b77b0056606c0677dba # linux/amd64
        ports:
          - "4566:4566"
        env:
          SERVICES: s3
          DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: 构建 s3cli
        run: go build -trimpath -o s3cli .
      - name: 运行 e2e 矩阵
        run: bash scripts/e2e-s3.sh
        env:
          S3CLI_E2E_ENDPOINT: http://127.0.0.1:4566
          S3CLI_E2E_ACCESS_KEY: test
          S3CLI_E2E_SECRET_KEY: test
