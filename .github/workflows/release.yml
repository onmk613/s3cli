name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: 校验 (test + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test -race ./...

  release:
    name: 构建并发布
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: 计算可复现时间戳
        id: meta
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: 全平台编译
        run: bash build.sh all
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
      - name: 生成 SBOM (CycloneDX)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -noserial -output bin/sbom.cdx.json .
      - name: 打包产物
        run: |
          cd bin
          for f in s3cli-*; do tar -czf "$f.tar.gz" "$f" && rm "$f"; done
          shasum -a 256 *.tar.gz sbom.cdx.json > SHA256SUMS
          ls -l
      - name: 安装 cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: 签名 SHA256SUMS (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature bin/SHA256SUMS.sig \
            --output-certificate bin/SHA256SUMS.pem \
            bin/SHA256SUMS
      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            bin/*.tar.gz
            bin/SHA256SUMS
            bin/SHA256SUMS.sig
            bin/SHA256SUMS.pem
            bin/sbom.cdx.json
          generate_release_notes: true
