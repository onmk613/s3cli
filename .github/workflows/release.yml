name: release

# 打 tag (v*) 时: 跑完整校验 -> 全平台交叉编译 -> 附带产物创建 GitHub Release。
# 可复现构建: 注入 SOURCE_DATE_EPOCH (tag 指向的 commit 时间), 同 tag 重建产物一致。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: 校验 (test + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test -race ./...

  release:
    name: 构建并发布
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: 计算可复现时间戳
        id: meta
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: 全平台编译
        run: bash build.sh all
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
      - name: 打包产物
        run: |
          cd bin
          for f in s3cli-*; do tar -czf "$f.tar.gz" "$f" && rm "$f"; done
          shasum -a 256 *.tar.gz > SHA256SUMS
          ls -l
      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.tar.gz
            bin/SHA256SUMS
          generate_release_notes: true
